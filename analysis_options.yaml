# This package is deliberately framework-free, so it uses the plain Dart lint
# set rather than a UI-framework one.
include: package:lints/recommended.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - annotate_overrides
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - sort_constructors_first
    - unawaited_futures
    - use_super_parameters

    # Note the absence of `require_trailing_commas`. The formatter decides comma
    # placement (it reshapes argument lists to fit the line width), so that lint
    # disagrees with `dart format` on exactly the files CI requires to be
    # formatted. Two gates that cannot both be satisfied are worse than either
    # one alone, so the formatter is the authority on commas.
