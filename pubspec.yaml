name: flutter_wwise
description: >-
  Unofficial Audiokinetic Wwise integration for Flutter on Windows, Linux and
  Android, built on dart:ffi. Unity and Unreal have official Wwise integrations;
  Flutter does not — this package fills that gap.
version: 0.1.0
repository: https://github.com/Nesarf/flutter-wwise
issue_tracker: https://github.com/Nesarf/flutter-wwise/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  ffigen: ^13.0.0

flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      android:
        package: dev.hollowcourt.flutter_wwise
        pluginClass: FlutterWwisePlugin
