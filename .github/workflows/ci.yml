name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to attach packages to, for example v0.2.0"
        required: false
        default: ""

env:
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  hygiene:
    name: Repository hygiene (neutrality guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No third-party SDK content
        run: |
          set -euo pipefail
          echo "== guarding against redistributed third-party SDK content =="
          fail=0
          if git ls-files | grep -Ei '(^|/)AK/.*\.h$'; then
            echo "::error::Third-party SDK headers appear to be committed."; fail=1
          fi
          if git ls-files | grep -Ei '\.(a|lib|dll|so|dylib)$'; then
            echo "::error::Native libraries appear to be committed."; fail=1
          fi
          if git ls-files | grep -Ei '\.(bnk|wem|wproj|wwu)$'; then
            echo "::error::Engine runtime/authoring artifacts appear to be committed."; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "ok: no third-party SDK content"

      - name: No version strings in tracked text
        run: |
          set -euo pipefail
          echo "== guarding against build fingerprints =="
          # A dotted numeric version of four components (N.N.N.N) is a build
          # fingerprint, not a semantic version. Semantic versions in prose such
          # as 1.2.3 are fine and are deliberately not matched.
          # CONTRIBUTING.md illustrates both permitted and forbidden forms, so
          # it is exempt from this scan.
          files=$(git ls-files '*.md' '*.dart' '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' \
                             '*.cmake' 'CMakeLists.txt' '*.yml' '*.yaml' \
                  | grep -v '^CONTRIBUTING.md$' || true)
          if [ -z "$files" ]; then echo "no text files to scan"; exit 0; fi
          if echo "$files" | xargs grep -nE '\b[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\b'; then
            echo "::error::A four-component version string was found. Remove it."
            exit 1
          fi
          echo "ok: no four-component version strings"

      - name: No absolute paths in tracked text
        run: |
          set -euo pipefail
          echo "== guarding against machine-specific paths =="
          files=$(git ls-files '*.md' '*.dart' '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' \
                             '*.cmake' 'CMakeLists.txt' '*.yml' '*.yaml' \
                  | grep -v '^CONTRIBUTING.md$' || true)
          if [ -z "$files" ]; then echo "no text files to scan"; exit 0; fi

          # A path prefix must be preceded by start-of-line or whitespace, and
          # followed by a path separator plus a name character. Requiring the
          # leading context is what keeps `https://...` from matching: there the
          # letter before `:/` is part of a scheme, not a drive letter.
          win='(^|[[:space:]"'"'"'(])[A-Za-z]:[\\/][A-Za-z0-9_.]'
          unix='(^|[[:space:]"'"'"'(])/(home|Users|opt|usr/local)/[A-Za-z0-9_.]'

          if echo "$files" | xargs grep -nE "$win"; then
            echo "::error::A Windows absolute path was found. Use a placeholder."
            exit 1
          fi
          if echo "$files" | xargs grep -nE "$unix"; then
            echo "::error::A unix absolute path was found. Use a placeholder."
            exit 1
          fi
          echo "ok: no absolute paths"

      - name: Vendor names stay out of code and protocol
        run: |
          set -euo pipefail
          echo "== guarding against de-facto vendor coupling =="
          # Permitted: README prose, the non-affiliation notice in LICENSE,
          # CHANGELOG history, and this guard's own pattern list.
          # Forbidden: source, protocol spec, build files, package manifest.
          files=$(git ls-files 'lib/**' 'src/**' 'docs/**' \
                             'pubspec.yaml' '*.cmake' 'CMakeLists.txt' 2>/dev/null || true)
          if [ -z "$files" ]; then echo "no implementation files yet"; exit 0; fi
          if echo "$files" | xargs grep -niE '(audiokinetic|wwise|flutter|unity|unreal)' 2>/dev/null; then
            echo "::error::A vendor or framework name appears in an implementation surface."
            echo "         Neutrality rule: names belong in prose, never in code."
            exit 1
          fi
          echo "ok: no vendor names in implementation surfaces"

      - name: Tracked text stays ASCII
        run: |
          set -euo pipefail
          echo "== guarding against encoding-dependent text =="
          # ASCII only, for two reasons. A compiler that decodes source using
          # the machine's code page can build the same file differently in
          # different regions, which is a reproducibility bug rather than a
          # warning to be silenced. And one text with one meaning stays
          # reviewable by everyone who reads it.
          #
          # Unlike the version and path scans, CONTRIBUTING.md gets no exemption
          # here: illustrating a forbidden form never requires a non-ASCII byte.
          # LICENSE and .gitattributes are named explicitly because neither has
          # an extension for the globs above to match, and the rule in
          # CONTRIBUTING.md covers every file in the repository.
          files=$(git ls-files '*.md' '*.dart' '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' \
                             '*.cmake' 'CMakeLists.txt' '*.yml' '*.yaml' \
                             'LICENSE' '.gitattributes' || true)
          if [ -z "$files" ]; then echo "no text files to scan"; exit 0; fi
          if echo "$files" | xargs grep -nP '[^\x00-\x7F]'; then
            echo "::error::Non-ASCII text found. Tracked text must be ASCII."
            echo "         Use -- for a dash, -> for an arrow, 'section N' for a"
            echo "         section reference, and + - | for box drawing."
            exit 1
          fi
          echo "ok: tracked text is ASCII"

  protocol:
    name: Protocol document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Spec is present and non-trivial
        run: |
          set -euo pipefail
          f=docs/RELAY_PROTOCOL.md
          test -f "$f" || { echo "::error::$f is missing"; exit 1; }
          lines=$(wc -l < "$f")
          echo "$f: $lines lines"
          [ "$lines" -gt 100 ] || { echo "::error::Protocol spec looks truncated"; exit 1; }

  native:
    name: Relay station (${{ matrix.os }}, native build, unit and end-to-end)
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should still tell us about the other: which code
      # paths compile where is the whole point of this job.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            station: build/oak-barrels
          - os: macos-latest
            # Also a unix-socket platform, and the one where MSG_NOSIGNAL is
            # absent, so the fallback in the send path compiles here first.
            station: build/oak-barrels
          - os: windows-latest
            # The default generator on Windows is multi-config, so the binary
            # lands under Release/ rather than at the build root.
            station: build/Release/oak-barrels.exe
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v7

      # What is slow here is compiling the station, so the key carries the
      # sources: a cache hit restores objects that would have been rebuilt the
      # same way. The architecture is in the key because object files are not
      # portable between them.
      - name: Cache the build tree and the Dart package cache
        uses: actions/cache@v6
        with:
          path: |
            build
            .pub-cache
          key: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('src/**', 'tests/**', 'CMakeLists.txt', 'pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-native-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # --config is ignored by single-config generators and required by
      # multi-config ones, so one command covers both.
      - name: Build
        run: cmake --build build --parallel --config Release

      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      # The Dart suite skips the end-to-end file when no station has been built.
      # Here one has, so point it at the binary and the tests actually run.
      - name: End to end, host process to station process
        env:
          OAK_BARRELS_STATION: ${{ github.workspace }}/${{ matrix.station }}
        run: dart test test/end_to_end_test.dart

  sanitizer:
    name: Native tests under ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Address and undefined behaviour together, built from the same sources
      # the matrix builds: the suite loads a shared object at run time, resolves
      # symbols out of it and drives a callback the engine would call on its
      # audio thread. A plain Release build cannot see a mistake in any of that.
      - name: Configure
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Native tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          # Report the stack for the first violation and stop there: a run that
          # continues past undefined behaviour describes a machine that is
          # already in an unknown state.
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure

  coverage:
    name: Native line coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      # --coverage is the compiler's own flag: it writes the notes gcov reads,
      # so what is measured is the code the tests reached, not what was
      # compiled. -O0 keeps the line numbers honest.
      - name: Configure
        run: |
          cmake -S . -B build-cov -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g"

      - name: Build
        run: cmake --build build-cov --parallel

      - name: Native tests
        run: ctest --test-dir build-cov --output-on-failure

      - name: Collect
        run: |
          set -euo pipefail
          lcov --capture --directory build-cov --output-file coverage.info \
            --ignore-errors mismatch,source
          lcov --remove coverage.info '/usr/*' '*/tests/*' \
            --output-file coverage.info --ignore-errors unused
          lcov --summary coverage.info

      - uses: actions/upload-artifact@v7
        with:
          name: native-coverage
          path: coverage.info

  package:
    name: Release package (${{ matrix.os }})
    # A package is built on demand and attached to a release. It is built from
    # the dispatched ref rather than from the tag, because v0.2.0 was tagged
    # before this job existed and so carries no packaging configuration of its
    # own. Every tag cut from here on does, and then the two are one tree.
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel --config Release

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B build

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(ls build/oak-barrels-*.zip build/oak-barrels-*.tar.gz 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "no package was produced"
            exit 1
          fi
          tag="${{ inputs.release_tag }}"
          repo="${{ github.repository }}"

          # Two jobs in this matrix can produce the same archive name, and one
          # duplicate went unnoticed exactly that way. Listing the assets before
          # and after makes a replacement a line in the log rather than a
          # surprise, without changing what --clobber is allowed to do.
          echo "== assets already on the release =="
          gh release view "$tag" --repo "$repo" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'

          echo "== uploading =="
          for f in $files; do
            echo "$(basename "$f") $(wc -c < "$f") bytes"
          done
          gh release upload "$tag" $files --repo "$repo" --clobber

          echo "== assets after upload =="
          gh release view "$tag" --repo "$repo" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'

  dart:
    name: Dart client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Cache the Dart package cache
        uses: actions/cache@v6
        with:
          path: .pub-cache
          key: ${{ runner.os }}-dart-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-
      - name: Resolve dependencies
        run: dart pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test
